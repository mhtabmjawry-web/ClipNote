<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipNote | همگام‌سازی ابری</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5686fe">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <!-- AWS SDK for S3 (برای ارتباط با ArvanCloud) -->
  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1692.0/dist/aws-sdk.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-base: #151517; --sidebar-fill: #1b1b1c; --label-primary: rgba(255,255,255,0.9);
      --label-secondary: #9ca3af; --label-tertiary: #6b7280; --border-l2: rgba(255,255,255,0.06);
      --brand-primary: #5686fe; --input-bg: #212123; --hover-bg: rgba(255,255,255,0.04);
      --scrollbar-bg: #3f3f46; --msg-bg: #2c2c2e; --sidebar-width: 261px;
      --font-family: 'Inter', system-ui, sans-serif;
      --radius-sm: 12px; --radius-md: 22px; --radius-lg: 24px; --radius-pill: 100px;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1); --danger: #ef4444;
      --header-height: 60px;
    }
    body { font-family: var(--font-family); background: var(--bg-base); color: var(--label-primary); height: 100vh; overflow: hidden; display: flex; }
    .app { display: flex; width: 100%; height: 100vh; }
    .sidebar {
      width: var(--sidebar-width); height: 100vh; background: var(--sidebar-fill);
      border-left: 1px solid var(--border-l2); display: flex; flex-direction: column;
      padding: 6px 12px 10px; flex-shrink: 0; transition: margin-right 0.3s; z-index: 20;
    }
    .sidebar.collapsed { margin-right: calc(var(--sidebar-width) * -1); }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .logo { width: 35px; height: 24px; background: var(--brand-primary); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
    .btn-new-chat { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--label-primary); font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: var(--radius-pill); cursor: pointer; }
    .btn-new-chat:hover { background: var(--hover-bg); }
    .sidebar-clips { flex: 1; overflow-y: auto; margin: 4px 0; }
    .clip-item {
      display: flex; align-items: center; height: 40px; padding: 9px 6px 9px 10px;
      border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition);
      margin-bottom: 2px; font-size: 14px; white-space: nowrap; overflow: hidden;
    }
    .clip-item:hover { background: var(--hover-bg); }
    .clip-item.active { background: rgba(86,134,254,0.12); }
    .clip-item .pin-icon { margin-left: 4px; font-size: 12px; flex-shrink: 0; }
    .clip-item .clip-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .clip-item .clip-time { font-size: 11px; color: var(--label-secondary); margin-right: 6px; flex-shrink: 0; }
    .clip-item .more-btn { opacity: 0; background: none; border: none; color: var(--label-secondary); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; margin-right: 4px; }
    .clip-item:hover .more-btn { opacity: 1; }
    .sidebar-footer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border-l2); }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
    .main-header { height: var(--header-height); display: flex; align-items: center; justify-content: space-between; padding: 0 44px; border-bottom: 1px solid transparent; }
    .main-header.scrolled { border-bottom-color: var(--border-l2); }
    .menu-toggle { background: none; border: none; color: var(--label-primary); font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; }
    .menu-toggle:hover { background: var(--hover-bg); }
    .search-input { background: var(--input-bg); border: 1px solid var(--border-l2); border-radius: var(--radius-lg); padding: 8px 16px; font-size: 14px; color: var(--label-primary); width: 220px; outline: none; }
    .clips-container { flex: 1; overflow-y: auto; padding: 20px 44px; display: flex; flex-direction: column; align-items: center; }
    .clip-detail { width: 100%; max-width: 840px; background: var(--msg-bg); border-radius: var(--radius-md); padding: 20px 24px; border: 1px solid var(--border-l2); }
    .clip-detail .clip-text { white-space: pre-wrap; margin-bottom: 16px; max-height: 55vh; overflow-y: auto; line-height: 1.7; }
    .clip-detail .clip-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--label-secondary); border-top: 1px solid var(--border-l2); padding-top: 12px; flex-wrap: wrap; gap: 8px; }
    .clip-actions { display: flex; gap: 6px; }
    .action-btn { background: transparent; border: none; color: var(--label-secondary); cursor: pointer; font-size: 13px; padding: 4px 10px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 4px; }
    .action-btn:hover { background: var(--hover-bg); color: var(--label-primary); }
    .edit-textarea { width: 100%; min-height: 100px; background: rgba(255,255,255,0.04); border: 2px solid var(--brand-primary); border-radius: 10px; color: white; padding: 12px; font-family: inherit; font-size: 15px; resize: vertical; margin-bottom: 12px; }
    .input-area { padding: 12px 44px 20px; background: var(--bg-base); }
    .input-wrapper { max-width: 840px; margin: 0 auto; background: var(--input-bg); border-radius: var(--radius-lg); border: 1px solid var(--border-l2); display: flex; align-items: flex-end; padding: 12px 16px; gap: 10px; }
    .main-textarea { flex: 1; background: transparent; border: none; resize: none; font-family: inherit; font-size: 16px; line-height: 24px; color: white; outline: none; max-height: 336px; }
    .send-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-primary); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty-main { text-align: center; color: var(--label-tertiary); margin-top: 50px; }
    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; }
    .toast { background: #333; color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; margin-top: 4px; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
    @media (max-width: 768px) {
      .sidebar { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30; transform: translateX(0); }
      .sidebar.collapsed { transform: translateX(100%); margin-right: 0; }
      .main-header { padding: 0 16px; }
      .clips-container { padding: 12px; }
      .input-area { padding: 8px 12px; }
      .search-input { width: 120px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">📋</div>
      <button class="btn-new-chat" id="btnNewClipSidebar">+ کلیپ جدید</button>
    </div>
    <div class="sidebar-clips" id="sidebarClipsList"></div>
  </aside>
  <main class="main">
    <header class="main-header" id="mainHeader">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <span class="page-title">ClipNote ابری</span>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="جستجو...">
    </header>
    <div class="clips-container" id="clipsContainer">
      <div id="clipDetailContainer" style="width:100%; display:flex; justify-content:center;"></div>
      <div class="empty-main" id="emptyMain" style="display:none;">کلیپی انتخاب نشده</div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea class="main-textarea" id="mainTextarea" rows="1" placeholder="متن جدید... (Enter ذخیره)"></textarea>
        <button class="send-btn" id="btnSend" disabled>📤</button>
      </div>
    </div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
  // ---------- تنظیمات ArvanCloud (با اطلاعات خودت) ----------
  const ACCESS_KEY = "5fb3bbc3-467d-4683-886a-bdd6764c85d9";
  const SECRET_KEY = "9068e316258f2d8c2cdd82eaad9de83153ce44886fb7351399db517146a0ffd5";
  const BUCKET_NAME = "clipnote-data";   // نام باکتی که ساختی
  const ENDPOINT = "https://s3.ir-thr-1.arvancloud.ir"; // منطقه تهران
  const OBJECT_KEY = "clips.json";

  // پیکربندی S3
  const s3 = new AWS.S3({
    endpoint: ENDPOINT,
    region: "ir-thr-1",
    credentials: { accessKeyId: ACCESS_KEY, secretAccessKey: SECRET_KEY },
    s3ForcePathStyle: true,
  });

  // ---------- متغیرهای برنامه ----------
  let clips = [];
  let activeClipId = null;
  let searchQuery = '';
  let editingClipId = null;

  // ---------- توابع کمکی ----------
  function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.getElementById('toastContainer').appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function relativeTime(ts) {
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'لحظاتی پیش';
    if (mins < 60) return mins + ' دقیقه';
    const hours = Math.floor(diff / 3600000);
    if (hours < 24) return hours + ' ساعت';
    const days = Math.floor(diff / 86400000);
    if (days === 1) return 'دیروز';
    return days + ' روز';
  }

  function truncate(text, len) {
    return text.length <= len ? text : text.substr(0, len) + '…';
  }

  // ---------- همگام‌سازی با ابر ----------
  async function saveClipsToCloud() {
    try {
      const params = {
        Bucket: BUCKET_NAME,
        Key: OBJECT_KEY,
        Body: JSON.stringify(clips),
        ContentType: 'application/json'
      };
      await s3.putObject(params).promise();
      console.log('ذخیره در ابر موفق');
    } catch (err) {
      console.error('خطا در ذخیره ابری:', err);
      showToast('❌ خطا در ذخیره ابری');
    }
  }

  async function loadClipsFromCloud() {
    try {
      const params = { Bucket: BUCKET_NAME, Key: OBJECT_KEY };
      const data = await s3.getObject(params).promise();
      const loaded = JSON.parse(data.Body.toString());
      clips = loaded;
      if (clips.length && !activeClipId) activeClipId = clips[0].id;
      renderSidebar();
      renderActiveClip();
      showToast('📥 همگام‌سازی از ابر انجام شد');
    } catch (err) {
      if (err.code === 'NoSuchKey') {
        // اولین بار: فایلی وجود ندارد، داده نمونه ایجاد کن
        clips = [
          { id: 'sample1', content: 'به ClipNote خوش آمدید! این یادداشت با ابر همگام می‌شود.', createdAt: Date.now(), pinned: true, title: '' }
        ];
        activeClipId = clips[0].id;
        await saveClipsToCloud();
        renderSidebar();
        renderActiveClip();
      } else {
        console.error(err);
        showToast('⚠️ خطا در بارگیری از ابر');
      }
    }
  }

  // ---------- عملیات روی کلیپ‌ها ----------
  async function addClip(content) {
    if (!content.trim()) return;
    const newClip = {
      id: Date.now() + '_' + Math.random().toString(36),
      content: content.trim(),
      createdAt: Date.now(),
      pinned: false,
      title: ''
    };
    clips.unshift(newClip);
    activeClipId = newClip.id;
    renderSidebar();
    renderActiveClip();
    await saveClipsToCloud();
    document.getElementById('mainTextarea').value = '';
    document.getElementById('btnSend').disabled = true;
    showToast('✅ کلیپ جدید ذخیره شد');
  }

  async function deleteClip(clipId) {
    clips = clips.filter(c => c.id !== clipId);
    if (activeClipId === clipId) {
      activeClipId = clips.length ? clips[0].id : null;
    }
    renderSidebar();
    renderActiveClip();
    await saveClipsToCloud();
    showToast('🗑️ حذف شد');
  }

  async function togglePin(clipId) {
    const clip = clips.find(c => c.id === clipId);
    if (clip) {
      clip.pinned = !clip.pinned;
      renderSidebar();
      if (activeClipId === clipId) renderActiveClip();
      await saveClipsToCloud();
      showToast(clip.pinned ? '📌 پین شد' : '📌 برداشته شد');
    }
  }

  async function updateClipContent(clipId, newContent) {
    const clip = clips.find(c => c.id === clipId);
    if (clip) {
      clip.content = newContent;
      renderSidebar();
      if (activeClipId === clipId) renderActiveClip();
      await saveClipsToCloud();
      showToast('✏️ ویرایش ذخیره شد');
    }
  }

  function copyClip(clipId) {
    const clip = clips.find(c => c.id === clipId);
    if (clip) {
      navigator.clipboard.writeText(clip.content);
      showToast('📋 کپی شد');
    }
  }

  // ---------- رندر UI ----------
  function renderSidebar() {
    let filtered = [...clips];
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(c => c.content.toLowerCase().includes(q) || (c.title && c.title.toLowerCase().includes(q)));
    }
    filtered.sort((a, b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return b.createdAt - a.createdAt;
    });
    let html = '';
    if (filtered.length === 0) {
      html = '<div style="padding:16px;color:var(--label-tertiary);">کلیپی یافت نشد</div>';
    } else {
      filtered.forEach(clip => {
        const displayTitle = (clip.title && clip.title.trim()) ? clip.title : truncate(clip.content, 30);
        html += `
          <div class="clip-item ${clip.id === activeClipId ? 'active' : ''}" data-id="${clip.id}">
            ${clip.pinned ? '<span class="pin-icon">📌</span>' : ''}
            <span class="clip-title">${escapeHtml(displayTitle)}</span>
            <span class="clip-time">${relativeTime(clip.createdAt)}</span>
            <button class="more-btn" data-action="more">⋯</button>
          </div>
        `;
      });
    }
    document.getElementById('sidebarClipsList').innerHTML = html;
  }

  function renderActiveClip() {
    const container = document.getElementById('clipDetailContainer');
    const empty = document.getElementById('emptyMain');
    const clip = clips.find(c => c.id === activeClipId);
    if (!clip) {
      empty.style.display = 'flex';
      container.innerHTML = '';
      return;
    }
    empty.style.display = 'none';
    const isEditing = (editingClipId === clip.id);
    if (isEditing) {
      container.innerHTML = `
        <div class="clip-detail">
          <textarea class="edit-textarea" id="editTextarea">${escapeHtml(clip.content)}</textarea>
          <div style="display:flex; gap:8px;">
            <button class="action-btn" id="saveEditBtn">✔️ ذخیره</button>
            <button class="action-btn" id="cancelEditBtn">✖️ لغو</button>
          </div>
          <div class="clip-meta"><span>در حال ویرایش</span></div>
        </div>
      `;
      document.getElementById('saveEditBtn').onclick = async () => {
        const newVal = document.getElementById('editTextarea').value.trim();
        if (!newVal) { showToast('متن نمی‌تواند خالی باشد'); return; }
        await updateClipContent(clip.id, newVal);
        editingClipId = null;
        renderActiveClip();
      };
      document.getElementById('cancelEditBtn').onclick = () => {
        editingClipId = null;
        renderActiveClip();
      };
    } else {
      container.innerHTML = `
        <div class="clip-detail">
          <div class="clip-text">${escapeHtml(clip.content)}</div>
          <div class="clip-meta">
            <span>${relativeTime(clip.createdAt)} · ${clip.content.length} کاراکتر ${clip.pinned ? '· پین شده' : ''}</span>
            <div class="clip-actions">
              <button class="action-btn" data-action="copy">📋 کپی</button>
              <button class="action-btn" data-action="edit">✏️ ویرایش</button>
              <button class="action-btn" data-action="pin">${clip.pinned ? '📌 برداشتن' : '📌 پین'}</button>
              <button class="action-btn" data-action="delete">🗑️ حذف</button>
            </div>
          </div>
        </div>
      `;
    }
  }

  // ---------- رویدادها ----------
  document.getElementById('sidebarClipsList').addEventListener('click', async (e) => {
    const item = e.target.closest('.clip-item');
    if (!item) return;
    const id = item.dataset.id;
    if (e.target.closest('.more-btn')) {
      // منوی ساده
      const action = prompt('1- کپی\n2- پین/برداشتن\n3- حذف\n4- ویرایش');
      if (action === '1') copyClip(id);
      else if (action === '2') await togglePin(id);
      else if (action === '3') await deleteClip(id);
      else if (action === '4') { editingClipId = id; renderActiveClip(); }
      return;
    }
    if (editingClipId) editingClipId = null;
    activeClipId = id;
    renderActiveClip();
    renderSidebar();
  });

  document.getElementById('clipDetailContainer').addEventListener('click', async (e) => {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;
    const action = btn.dataset.action;
    if (!activeClipId) return;
    if (action === 'copy') copyClip(activeClipId);
    else if (action === 'edit') { editingClipId = activeClipId; renderActiveClip(); }
    else if (action === 'pin') await togglePin(activeClipId);
    else if (action === 'delete') await deleteClip(activeClipId);
  });

  const sendBtn = document.getElementById('btnSend');
  const textarea = document.getElementById('mainTextarea');
  textarea.addEventListener('input', () => {
    sendBtn.disabled = textarea.value.trim() === '';
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 336) + 'px';
  });
  sendBtn.onclick = () => addClip(textarea.value);
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
      e.preventDefault();
      addClip(textarea.value);
    }
  });

  document.getElementById('btnNewClipSidebar').onclick = () => {
    textarea.value = '';
    textarea.focus();
    sendBtn.disabled = true;
  };
  document.getElementById('menuToggle').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  };
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderSidebar();
  });

  // بارگذاری اولیه
  (async () => {
    await loadClipsFromCloud();
    // اگر بعد از بارگذاری هنوز هیچ کلیپی وجود نداشت (خطا) نمونه بساز
    if (!clips.length) {
      clips = [{ id: 'sample', content: 'نمونه کلیپ – این پیام از ابر همگام می‌شود.', createdAt: Date.now(), pinned: false, title: '' }];
      activeClipId = clips[0].id;
      await saveClipsToCloud();
      renderSidebar();
      renderActiveClip();
    }
  })();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
